<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>binance check</title>
<style>body{background:#0b1118;color:#dfe8f5;font:12px ui-monospace,Menlo,monospace;padding:10px}pre{white-space:pre-wrap;line-height:1.35}</style>
</head><body><pre id="out">running…</pre>
<script>
const OUT = document.getElementById('out');
const log = s => { OUT.textContent += '\n' + s; };
const q = new URLSearchParams(location.search);
const F = 'https://fapi.binance.com';

async function get(path){
  const t0 = performance.now();
  const r = await fetch(F + path, { cache:'no-store' });
  const txt = await r.text();
  return { status: r.status, acao: r.headers.get('access-control-allow-origin'), ms: Math.round(performance.now()-t0), body: txt };
}
function rsi(cl, p){ p = p || 14; const out = new Array(cl.length).fill(null); if (cl.length < p+1) return out;
  let g=0,l=0; for (let i=1;i<=p;i++){ const d=cl[i]-cl[i-1]; if (d>=0) g+=d; else l-=d; } g/=p; l/=p;
  out[p] = l===0?100:100-100/(1+g/l);
  for (let i=p+1;i<cl.length;i++){ const d=cl[i]-cl[i-1]; g=(g*(p-1)+Math.max(d,0))/p; l=(l*(p-1)+Math.max(-d,0))/p; out[i]= l===0?100:100-100/(1+g/l); }
  return out; }
function ema(v,p){ const out=new Array(v.length).fill(null); if(v.length<p) return out; const k=2/(p+1); let s=0; for(let i=0;i<p;i++) s+=v[i]; s/=p; out[p-1]=s;
  for(let i=p;i<v.length;i++){ s=v[i]*k+s*(1-k); out[i]=s; } return out; }
const fmt = n => Math.abs(n) < 0.01 ? Number(n.toPrecision(6)).toString() : Number(n.toPrecision(8)).toString();
const kst = ms => new Date(ms + 9*3600e3).toISOString().slice(5,16).replace('T',' ');

(async () => {
  try {
    const info = await get('/fapi/v1/exchangeInfo');
    log('exchangeInfo ' + info.status + ' acao=' + info.acao + ' ' + info.ms + 'ms len=' + info.body.length);
    const j = JSON.parse(info.body);
    const perps = j.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING');
    log('USDT perpetuals=' + perps.length);

    if (q.get('mode') === 'rank'){
      const t = await get('/fapi/v1/ticker/24hr');
      log('ticker24hr ' + t.status + ' acao=' + t.acao + ' ' + t.ms + 'ms len=' + t.body.length);
      const tk = JSON.parse(t.body);
      const stable = new Set(['USDC','FDUSD','TUSD','BUSD','DAI','USDP','EURI','AEUR','USDE','XUSD','USD1','EUR']);
      const map = new Map(perps.map(s => [s.symbol, s]));
      const rows = tk.filter(r => map.has(r.symbol) && !stable.has(map.get(r.symbol).baseAsset))
        .map(r => ({ sym:r.symbol, base:map.get(r.symbol).baseAsset, qv:+r.quoteVolume, last:+r.lastPrice, chg:+r.priceChangePercent }))
        .sort((a,b)=>b.qv-a.qv);
      rows.slice(0,20).forEach((r,i)=> log((i+1) + ' ' + r.base + ' qv=' + (r.qv/1e6).toFixed(1) + 'M last=' + fmt(r.last) + ' chg=' + r.chg + '%'));
      log('DONE');
      return;
    }

    const syms = (q.get('syms') || '').split(',').filter(Boolean);
    for (const s of syms){
      const t = await get('/fapi/v1/ticker/24hr?symbol=' + s);
      const tk = JSON.parse(t.body);
      log('\n## ' + s + ' last=' + fmt(+tk.lastPrice) + ' 24h hi=' + fmt(+tk.highPrice) + ' lo=' + fmt(+tk.lowPrice) + ' open=' + fmt(+tk.openPrice) + ' qv=' + (+tk.quoteVolume/1e6).toFixed(0) + 'M');
      for (const [tf, iv] of [['1d','1d'],['4h','4h'],['1h','1h']]){
        const r = await get('/fapi/v1/klines?symbol=' + s + '&interval=' + iv + '&limit=200');
        if (r.status !== 200){ log(' ' + tf + ' klines ' + r.status + ' acao=' + r.acao + ' body=' + r.body.slice(0,120)); continue; }
        const cs = JSON.parse(r.body).map(a => ({t:a[0], o:+a[1], h:+a[2], l:+a[3], c:+a[4], v:+a[5], qv:+a[7], ct:a[6], conf: a[6] < Date.now()}));
        const cl = cs.map(c=>c.c), R = rsi(cl), e20 = ema(cl,20), e50 = ema(cl,50);
        const n = cs.length - 1;
        log(' ' + tf + ' ' + r.status + ' bars=' + cs.length + ' RSI=' + R[n].toFixed(1) + ' EMA20=' + fmt(e20[n]) + ' EMA50=' + fmt(e50[n]) +
            ' 60hi=' + fmt(Math.max(...cs.slice(-60).map(c=>c.h))) + ' 60lo=' + fmt(Math.min(...cs.slice(-60).map(c=>c.l))));
        const vmed = cs.slice(-60).map(c=>c.v).sort((a,b)=>a-b)[30];
        const take = tf === '1d' ? 10 : 12;
        cs.slice(-take).forEach(c => log('   ' + kst(c.t) + ' O' + fmt(c.o) + ' H' + fmt(c.h) + ' L' + fmt(c.l) + ' C' + fmt(c.c) + ' qv=' + (c.qv/1e6).toFixed(1) + 'M vx=' + (c.v/vmed).toFixed(2) + (c.conf?'':' LIVE')));
      }
    }
    log('DONE');
  } catch (e){
    log('ERROR ' + e);
    log('DONE');
  }
})();
</script></body></html>
