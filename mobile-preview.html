<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile preview</title>
<style>
  html,body{margin:0;padding:0;background:#070b12;height:100%}
  .frame{width:390px;height:844px;margin:0 auto;overflow:hidden}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="frame"><iframe id="pv" src="verify.html" title="모바일 미리보기"></iframe></div>
<script>
/* 검증용 임시 하네스: ?sym=ETH&to=scnSec 처럼 넘기면 그 종목·그 구역으로 맞춰 미리보기를 띄웁니다. */
(function(){
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('pv');
  var sym = q.get('sym'), to = q.get('to');
  f.addEventListener('load', function(){
    var d = f.contentDocument, w = f.contentWindow;
    if (!d || !w) return;
    var tries = 0;
    var tick = setInterval(function(){
      var chip = sym ? d.querySelector('.chip[data-sym="' + sym + '-USDT-SWAP"]') : null;
      if (sym && !chip && tries++ < 40) return;
      if (chip) chip.click();
      clearInterval(tick);
      setTimeout(function(){
        var el = to ? d.getElementById(to) : null;
        if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 6);
      }, 1600);
    }, 250);
  });
})();
</script>
</body>
</html>
